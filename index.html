<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="외박 계산기">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>외박 계산기</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#080b14; --card:#121728; --card2:#1a2135; --line:#242c44;
    --text:#eef1f8; --muted:#8a93a9; --accent:#6d8cff;
    --green:#3ddc97; --amber:#ffb454; --red:#ff6b6b; --gray:#5a6379;
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",system-ui,sans-serif;}
  body{min-height:100dvh;background:radial-gradient(900px 500px at 50% -10%,#1a2450 0%,transparent 60%),var(--bg);}
  .app{max-width:430px;margin:0 auto;min-height:100dvh;padding:18px 18px calc(96px + env(safe-area-inset-bottom));}
  header{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 18px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.3px}
  .brand .logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(150deg,#2b3d7a,#1a2340);border:1px solid #33406b;font-size:15px}
  .month-pill{font-size:12px;color:var(--muted);background:#131a2b;border:1px solid var(--line);padding:6px 10px;border-radius:999px}

  .hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;
    background:linear-gradient(155deg,#21305e 0%,#161d33 55%,#141a2b 100%);
    border:1px solid #2c3860;box-shadow:0 18px 40px -24px #000}
  .hero:after{content:"";position:absolute;right:-60px;top:-70px;width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle,#6d8cff33,transparent 70%)}
  .hero-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
  .chip{font-size:11px;font-weight:700;color:#b9c6ff;background:#6d8cff1f;border:1px solid #6d8cff40;padding:5px 9px;border-radius:999px}
  .week{font-size:12px;color:var(--muted)}
  .date{margin-top:16px;font-size:15px;color:#c9d1ea}
  .date b{color:#fff}
  .prob{display:flex;align-items:baseline;gap:4px;margin-top:2px}
  .prob .num{font-size:66px;font-weight:800;letter-spacing:-3px;line-height:1}
  .prob .pct{font-size:22px;font-weight:700;color:#9fb2ff}
  .prob-label{font-size:12px;color:var(--muted);margin-top:4px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
  .row{display:flex;align-items:center;justify-content:space-between;font-size:14px}
  .row b{font-size:15px}
  .muted{color:var(--muted)}
  .small{font-size:12px}
  .bar{height:8px;border-radius:99px;background:#232b42;margin:11px 0 8px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#6d8cff,#9f7bff);transition:width .3s}

  .rec{border-left:3px solid var(--gray)}
  .rec.go{border-left-color:var(--green);background:linear-gradient(90deg,#3ddc970d,var(--card) 40%)}
  .rec.hold{border-left-color:var(--amber);background:linear-gradient(90deg,#ffb4540d,var(--card) 40%)}
  .rec.danger{border-left-color:var(--red);background:linear-gradient(90deg,#ff6b6b10,var(--card) 40%)}
  .rec-head{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;letter-spacing:-.2px}
  .rec-head .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
  .rec.go .rec-head{color:var(--green)} .rec.hold .rec-head{color:var(--amber)}
  .rec.danger .rec-head{color:var(--red)} .rec.safe .rec-head{color:#aab3c8}
  .rec p{margin:7px 0 0;font-size:12.5px;line-height:1.55;color:#aeb8d0}

  .actions{display:flex;gap:8px;margin-top:14px}
  .btn{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--text);
    border-radius:13px;padding:12px 8px;font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer}
  .btn.primary{background:linear-gradient(180deg,#5f7ff5,#4a63d8);border-color:#6d8cff;box-shadow:0 8px 20px -12px #6d8cff}
  .btn.primary.green{background:linear-gradient(180deg,#2ec989,#22a874);border-color:#3ddc97;box-shadow:0 8px 20px -12px #3ddc97;color:#04150e}
  .btn:disabled{opacity:.4}
  .btn:active{transform:translateY(1px)}
  .note{font-size:11.5px;color:#6f7992;line-height:1.55;margin-top:10px}
  .note b{color:#b9c4dc}

  .banner{margin-top:12px;border-radius:16px;padding:12px 14px;font-size:12.5px;line-height:1.5;
    background:#ff6b6b14;border:1px solid #ff6b6b40;color:#ffb3b3;display:flex;gap:8px}
  .banner.warn{background:#ffb45412;border-color:#ffb4543d;color:#ffd79a}

  .tabs{position:fixed;left:0;right:0;bottom:0;padding:8px 18px calc(8px + env(safe-area-inset-bottom));
    background:#0a0e19ee;backdrop-filter:blur(14px);border-top:1px solid #1b2236;z-index:20}
  .tabs-in{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .tab{background:none;border:0;color:#6e7890;font-family:inherit;font-size:11px;font-weight:700;
    padding:8px 4px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
  .tab .ico{font-size:18px;line-height:1}
  .tab.on{color:#c9d4ff;background:#6d8cff14}

  .sect-title{font-size:12px;font-weight:800;color:#7c86a0;letter-spacing:.4px;margin:20px 2px 8px}
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center}
  .stat .k{font-size:10.5px;color:var(--muted);font-weight:700}
  .stat .v{font-size:18px;font-weight:800;margin-top:5px;letter-spacing:-.5px}
  .stat .v.green{color:var(--green)} .stat .v.red{color:var(--red)}

  .switchrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .switch{width:46px;height:27px;border-radius:99px;background:#2a3350;position:relative;border:0;cursor:pointer;flex:none}
  .switch:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#8c96b0;transition:.2s}
  .switch.on{background:#3ddc9733}
  .switch.on:after{left:22px;background:var(--green)}

  .weekhead,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .weekhead{margin:14px 0 6px}
  .weekhead span{text-align:center;font-size:10.5px;color:#6f7992;font-weight:700}
  .cell{aspect-ratio:1/1.18;border-radius:12px;background:#101526;border:1px solid #1c2337;
    padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    position:relative;cursor:pointer;overflow:hidden}
  .cell.off{background:transparent;border-color:transparent;cursor:default}
  .cell .d{font-size:11.5px;font-weight:700;color:#c7cfe4}
  .cell .p{font-size:8.5px;font-weight:800;margin-top:3px;color:#7f8dab;letter-spacing:-.2px}
  .cell.hi .p{color:var(--amber)}
  .cell.mid .p{color:#8aa0e8}
  .cell.low .p{color:#5f6b86}
  .cell.today{border-color:#6d8cff;box-shadow:0 0 0 1px #6d8cff55,0 0 18px -8px #6d8cff}
  .cell.holiday{background:#151a29}
  .cell.holiday .p{color:#4f5870}
  .cell .marks{display:flex;gap:3px;margin-top:auto;font-size:9px;line-height:1}
  .dot-app{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .chk{color:var(--green);font-size:10px;font-weight:800}
  .miss{color:var(--red);font-size:9px;font-weight:800}
  .cell.planned{outline:1px dashed #6d8cffaa;outline-offset:-3px}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:10.5px;color:#7f89a2}
  .legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}

  .list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .item{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-radius:13px;
    background:#101526;border:1px solid #1c2337;font-size:13px}
  .seg{display:flex;gap:5px;background:#0d1220;border:1px solid #1c2337;border-radius:12px;padding:4px}
  .seg button{flex:1;border:0;background:none;color:#8a93a9;font-family:inherit;font-size:12px;font-weight:700;
    padding:8px 4px;border-radius:9px;cursor:pointer}
  .seg button.on{background:#25305a;color:#dbe3ff}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#1a2135;
    color:#dfe5f5;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
  .stepper b{min-width:42px;text-align:center;font-size:14px}
  input[type=date]{background:#101526;border:1px solid var(--line);color:var(--text);border-radius:10px;
    padding:9px 10px;font-family:inherit;font-size:16px}
  .link{color:#9fb2ff;text-decoration:none;font-size:12px}
  details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
  summary{cursor:pointer;font-size:13px;font-weight:700}
  details p{font-size:12px;line-height:1.7;color:#9aa4bd;margin:10px 0 0}
  .sheet{position:fixed;inset:0;background:#000000aa;display:none;align-items:flex-end;z-index:40}
  .sheet.on{display:flex}
  .sheet-box{width:100%;max-width:430px;margin:0 auto;background:#131a2b;border-radius:22px 22px 0 0;
    padding:18px 18px calc(20px + env(safe-area-inset-bottom));border-top:1px solid #2a3350}
  .sheet-box h3{margin:0 0 12px;font-size:15px}
  .sheet .btn{width:100%;margin-top:8px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="tabs"><div class="tabs-in" id="tabs"></div></div>
<div class="sheet" id="sheet"><div class="sheet-box" id="sheetBox"></div></div>
<script>
/* ---------- utils ---------- */
const P=new URLSearchParams(location.search);
const DEMO=P.get('demo')==='1';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const WD=['일','월','화','수','목','금','토'];
const mondayOf=d=>{const x=sod(d);return addD(x,-((x.getDay()+6)%7));};
const today=P.get('today')?new Date(P.get('today')+'T00:00:00'):sod(new Date());
const now=new Date();
const realToday=ymd(sod(now))===ymd(today);

/* ---------- state ---------- */
const KEY='dorm-calc-v2';
const DEF={settings:{highDay:1,pHigh:70,weekCap:2,quota:10,penalty:2},
  apps:[],rollcalls:[],noRoll:[],holidays:[],used:{},missBase:0,merit:0};
function seed(){
  const s={...DEF,apps:['2026-11-10','2026-11-17'],rollcalls:['2026-11-05','2026-11-10','2026-11-17'],
    used:{'2026-11':2},missBase:1,merit:3};
  return s;
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||(DEMO?seed():structuredClone(DEF));}catch(e){S=DEMO?seed():structuredClone(DEF);}
S.settings={...DEF.settings,...S.settings};
S.noRoll=S.noRoll||[]; S.used=S.used||{};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));

/* ---------- rules ---------- */
const mk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const inMonth=(d,ref)=>d.getMonth()===ref.getMonth()&&d.getFullYear()===ref.getFullYear();
const isHoliday=d=>S.holidays.includes(ymd(d));
const isEve=d=>S.holidays.includes(ymd(addD(d,1)));
const eligible=d=>{const w=d.getDay();return w>=1&&w<=4&&!isHoliday(d)&&!isEve(d);};
const baseP=d=>{if(!eligible(d))return 0;return d.getDay()===S.settings.highDay?S.settings.pHigh/100:Math.max(0,S.settings.pHigh-30)/100;};
const hasRoll=d=>S.rollcalls.includes(ymd(d));
const hasNoRoll=d=>S.noRoll.includes(ymd(d));

/* P(이번 주 캡이 아직 안 찼음) — 기록 없으면 확률로 계산 */
function weekNotFull(d){
  let dp=[1], day=mondayOf(d);
  while(day<d){
    const p=hasRoll(day)?1:(hasNoRoll(day)?0:baseP(day));
    const nd=new Array(dp.length+1).fill(0);
    for(let k=0;k<dp.length;k++){
      nd[k]+=dp[k]*(1-p);
      if(k+1<=S.settings.weekCap)nd[k+1]+=dp[k]*p;
    }
    dp=nd; day=addD(day,1);
  }
  return dp.slice(0,S.settings.weekCap).reduce((a,b)=>a+b,0);
}
const prob=d=>eligible(d)?weekNotFull(d)*baseP(d):0;
const expectedWeek=d=>{
  let sum=0,day=mondayOf(d);
  for(let i=0;i<7;i++,day=addD(day,1)){
    sum+=hasRoll(day)?1:(hasNoRoll(day)?0:baseP(day));
  }
  return Math.min(S.settings.weekCap,sum);
};
const isApplied=d=>S.apps.includes(ymd(d));
const usedMonth=ref=>S.used[mk(ref)]||0;
const setUsed=(ref,n)=>{S.used[mk(ref)]=Math.max(0,n);};
const leftMonth=ref=>Math.max(0,S.settings.quota-usedMonth(ref));
function remainingEligible(from,to){const out=[];let d=sod(from);while(d<=to){if(eligible(d))out.push(new Date(d));d=addD(d,1);}return out;}
const endOfMonth=d=>new Date(d.getFullYear(),d.getMonth()+1,0);
const recordedMisses=()=>S.rollcalls.filter(r=>!S.apps.includes(r)).length;
const missCount=()=>S.missBase+recordedMisses();
function deadlinePassed(){if(!realToday)return false;const dl=new Date(today);dl.setHours(22,0,0,0);return now>=dl;}

/* ---------- recommendation ---------- */
function recommend(){
  const q=S.settings.quota,left=leftMonth(today);
  const rem=remainingEligible(today,endOfMonth(today));
  const p=prob(today);
  const wr=S.rollcalls.filter(r=>{const rd=new Date(r+'T00:00:00');return +mondayOf(rd)===+mondayOf(today);}).length;
  if(!eligible(today))return{tone:'safe',title:'오늘은 점호 없음',reason:'금·토·일과 공휴일 전날은 인원점검을 하지 않아요.'};
  if(wr>=S.settings.weekCap)return{tone:'safe',title:'이번 주는 끝났어',reason:`이번 주 점호가 ${S.settings.weekCap}회 나와서 남은 요일은 안전해요.`};
  if(p===0)return{tone:'safe',title:'이번 주는 거의 끝났어',reason:`이번 주 점호가 ${S.settings.weekCap}회 채워졌을 가능성이 높아요.`};
  if(deadlinePassed())return{tone:'warn',title:'오늘 마감 지났어',reason:'22:00이 지나서 오늘 신청은 불가해요. 23:30 전에 층장에게 고지하세요.'};
  if(left<=0)return{tone:'danger',title:'이번 달 신청 끝',reason:'10회를 다 썼어요. 초과 1회당 -1점이 붙어요.'};
  if(left>=rem.length)return{tone:'go',title:'오늘도 쓰자',reason:`남은 월~목 ${rem.length}일보다 신청이 ${left}개 많아서 전부 커버돼요.`};
  if(p>=0.6)return{tone:'go',title:'오늘 쓰자',reason:`오늘 확률 ${Math.round(p*100)}%로 높은 날이에요. 남은 신청 ${left}개.`};
  const later=rem.filter(d=>+d>+today&&prob(d)>p);
  if(p<0.5&&later.length)return{tone:'hold',title:'오늘은 아껴',reason:`오늘 ${Math.round(p*100)}%인데 더 높은 날이 ${later.length}일 남아 있어요.`};
  return{tone:'hold',title:'여유 있으면 쓰자',reason:`오늘 ${Math.round(p*100)}%, 남은 신청 ${left}개, 남은 월~목 ${rem.length}일이에요.`};
}

/* ---------- actions ---------- */
function setApp(d,on){
  const k=ymd(d),i=S.apps.indexOf(k),cur=usedMonth(d);
  if(on&&i<0){S.apps.push(k);setUsed(d,cur+1);}
  if(!on&&i>=0){S.apps.splice(i,1);setUsed(d,Math.max(0,cur-1));}
  save();render();
}
function setRoll(d,on){
  const k=ymd(d),i=S.rollcalls.indexOf(k),j=S.noRoll.indexOf(k);
  if(on){if(i<0)S.rollcalls.push(k);if(j>=0)S.noRoll.splice(j,1);}
  else{if(i>=0)S.rollcalls.splice(i,1);if(j<0)S.noRoll.push(k);}
  save();render();
}
function setSetting(k,v){S.settings[k]=v;save();render();}

/* ---------- render ---------- */
let tab=P.get('tab')||'today';
let projection=false;

function pct(d){
  if(!eligible(d))return'';
  if(+d<+today)return'';
  const p=prob(d);if(p===0)return'안전';return Math.round(p*100)+'%';
}
function cellClass(d){
  const p=prob(d);let c='cell';
  if(!inMonth(d,today))c+=' out';
  if(isHoliday(d))c+=' holiday';
  if(+d===+today)c+=' today';
  if(p>=0.6)c+=' hi';else if(p>=0.4)c+=' mid';else if(p>0)c+=' low';
  if(projection&&projSet().has(ymd(d)))c+=' planned';
  return c;
}
function projSet(){return projection?new Set(remainingEligible(today,endOfMonth(today)).map(ymd)):new Set();}

function render(){
  const app=document.getElementById('app');
  app.innerHTML=tab==='today'?viewToday():tab==='cal'?viewCal():viewSettings();
  document.getElementById('tabs').innerHTML=[['today','📝','오늘'],['cal','📅','달력'],['set','⚙️','설정']]
    .map(([id,ico,l])=>`<button class="tab ${tab===id?'on':''}" onclick="go('${id}')"><span class="ico">${ico}</span>${l}</button>`).join('');
}
function go(t){tab=t;render();}

function viewToday(){
  const p=prob(today),left=leftMonth(today),used=usedMonth(today);
  const rem=remainingEligible(today,endOfMonth(today));
  const need=rem.length, surplus=left-need, applied=isApplied(today);
  const rec=recommend(), mc=missCount();
  return `
  <header>
    <div class="brand"><span class="logo">🌙</span> 외박 계산기</div>
    <div class="month-pill">${today.getFullYear()}. ${today.getMonth()+1}</div>
  </header>

  <section class="hero">
    <div class="hero-top">
      <span class="chip">${today.getDay()===S.settings.highDay?'고확률 요일':'월~목 점호일'}</span>
      <span class="week">이번 주 예상 ${expectedWeek(today).toFixed(1)}/${S.settings.weekCap}회</span>
    </div>
    <div class="date">${today.getMonth()+1}월 ${today.getDate()}일 <b>${WD[today.getDay()]}요일</b></div>
    <div class="prob"><span class="num">${Math.round(p*100)}</span><span class="pct">%</span></div>
    <div class="prob-label">${eligible(today)?'오늘 점호 확률':'오늘은 점호 없는 날'}</div>
  </section>

  <section class="card">
    <div class="row"><span>이번 달 외박신청</span><b>${used} / ${S.settings.quota}</b></div>
    <div class="bar"><i style="width:${Math.min(100,used/S.settings.quota*100)}%"></i></div>
    <div class="row small"><span class="muted">${left}개 남음</span><span class="muted">남은 월~목 ${need}일</span></div>
    <div class="note">${surplus>=0
      ?`오늘부터 월~목을 전부 신청하면 <b>${surplus}개 남아요</b>`
      :`오늘부터 월~목을 전부 쓰면 <b>${-surplus}개 부족해요</b>`}</div>
  </section>

  <section class="card rec ${rec.tone}">
    <div class="rec-head"><span class="dot"></span>${rec.title}</div>
    <p>${rec.reason}</p>
    <div class="actions">
      <button class="btn ${applied?'primary green':''}" ${deadlinePassed()&&!applied?'disabled':''} onclick="setApp(today,true)">${applied?'✓ 신청함':'신청함'}</button>
      <button class="btn" onclick="setApp(today,false)">안 함</button>
    </div>
  </section>

  ${mc>=3?`<div class="banner">⚠️ 학기 누적 불참 <b>${mc}회</b> — 5회면 한 학기 입사 불가, 6회면 강제 퇴사예요.</div>`
    :mc>0?`<div class="banner warn">학기 누적 불참 ${mc}회 · 5회면 입사 불가</div>`:''}

  <div class="note" style="padding:0 4px">점호 결과를 매일 기록하지 않아도 돼요. 몰라도 확률로 계산하고, 아는 날만 달력에서 기록하면 그날은 확정값으로 반영돼요.</div>
  `;
}

function viewCal(){
  const first=new Date(today.getFullYear(),today.getMonth(),1);
  const end=endOfMonth(today);
  const startPad=(first.getDay()+6)%7;
  const left=leftMonth(today),need=remainingEligible(today,end).length,surplus=left-need;
  const pl=projSet();
  let cells='';
  for(let i=0;i<startPad;i++)cells+=`<div class="cell off"></div>`;
  for(let d=new Date(first);d<=end;d=addD(d,1)){
    const k=ymd(d),app=isApplied(d),roll=hasRoll(d),miss=roll&&!app;
    cells+=`<div class="${cellClass(d)}" onclick="openCell('${k}')">
      <span class="d">${d.getDate()}</span><span class="p">${pct(d)}</span>
      <span class="marks">${app?'<span class="dot-app"></span>':''}${roll?'<span class="chk">✓</span>':''}${miss?'<span class="miss">-2</span>':''}</span></div>`;
  }
  return `
  <header><div class="brand"><span class="logo">📅</span> ${today.getMonth()+1}월 달력</div>
    <div class="month-pill">${today.getFullYear()}</div></header>

  <div class="summary">
    <div class="stat"><div class="k">필요</div><div class="v">${need}일</div></div>
    <div class="stat"><div class="k">잔여 신청</div><div class="v">${left}개</div></div>
    <div class="stat"><div class="k">${surplus>=0?'남음':'부족'}</div><div class="v ${surplus>=0?'green':'red'}">${surplus>=0?'+':''}${surplus}</div></div>
  </div>

  <section class="card"><div class="switchrow">
    <div><div style="font-weight:700;font-size:13.5px">오늘부터 월~목 전부 신청</div>
    <div class="muted small" style="margin-top:3px">${need}일 필요 · ${left}개 보유</div></div>
    <button class="switch ${projection?'on':''}" onclick="projection=!projection;render()"></button>
  </div></section>

  <div class="weekhead">${['월','화','수','목','금','토','일'].map(w=>`<span>${w}</span>`).join('')}</div>
  <div class="grid">${cells}</div>
  <div class="legend">
    <span><i style="background:#6d8cff"></i>신청함</span>
    <span><i style="background:#3ddc97"></i>점호 있음(기록)</span>
    <span><i style="background:#ff6b6b"></i>불참 -2</span>
    <span><i style="background:#ffb454"></i>고확률</span>
  </div>
  <div class="note">날짜를 누르면 신청/점호 기록을 넣을 수 있어요. 점호는 몰라도 그냥 넘어가면 돼요.</div>
  `;
}

function viewSettings(){
  const s=S.settings, used=usedMonth(today), mc=missCount();
  return `
  <header><div class="brand"><span class="logo">⚙️</span> 설정</div></header>

  <div class="sect-title">점호 확률</div>
  <section class="card">
    <div class="row"><span>고확률 요일</span></div>
    <div class="seg" style="margin-top:10px">${[1,2,3,4].map(d=>`<button class="${s.highDay===d?'on':''}" onclick="setSetting('highDay',${d})">${WD[d]}</button>`).join('')}</div>
    <div class="row" style="margin-top:16px"><span>그날 확률</span>
      <div class="stepper"><button onclick="setSetting('pHigh',Math.max(50,${s.pHigh-5}))">−</button><b>${s.pHigh}%</b><button onclick="setSetting('pHigh',Math.min(90,${s.pHigh+5}))">+</button></div></div>
    <div class="muted small" style="margin-top:8px">나머지 요일은 자동으로 ${Math.max(0,s.pHigh-30)}%</div>
  </section>

  <div class="sect-title">한도</div>
  <section class="card">
    <div class="row"><span>주당 최대 점호</span>
      <div class="stepper"><button onclick="setSetting('weekCap',Math.max(1,${s.weekCap-1}))">−</button><b>${s.weekCap}회</b><button onclick="setSetting('weekCap',Math.min(3,${s.weekCap+1}))">+</button></div></div>
    <div class="row" style="margin-top:16px"><span>월 외박신청</span>
      <div class="stepper"><button onclick="setSetting('quota',Math.max(1,${s.quota-1}))">−</button><b>${s.quota}회</b><button onclick="setSetting('quota',Math.min(15,${s.quota+1}))">+</button></div></div>
    <div class="row" style="margin-top:16px"><span>이번 달 사용</span>
      <div class="stepper"><button onclick="setUsed(today,${used-1});save();render()">−</button><b>${used}회</b><button onclick="setUsed(today,${used+1});save();render()">+</button></div></div>
    <div class="muted small" style="margin-top:8px">학교 시스템에서 확인한 숫자로 맞춰도 돼요</div>
  </section>

  <div class="sect-title">불참 / 상벌점</div>
  <section class="card">
    <div class="row"><span>학기 누적 불참</span>
      <div class="stepper"><button onclick="S.missBase=Math.max(0,${mc-1});save();render()">−</button><b>${mc}회</b><button onclick="S.missBase=${mc+1};save();render()">+</button></div></div>
    <div class="muted small" style="margin-top:8px">5회면 입사 불가, 6회면 퇴사 · 기록된 불참 포함</div>
    <div class="row" style="margin-top:14px"><span>상점</span><b>${S.merit}점</b></div>
    <div class="actions"><button class="btn" onclick="S.merit++;save();render()">상점 +1</button>
      <button class="btn" onclick="S.merit=Math.max(0,S.merit-1);save();render()">−1</button></div>
    <div class="muted small" style="margin-top:8px">벌점 ${mc*s.penalty}점 · 상점과 상쇄</div>
  </section>

  <div class="sect-title">공휴일</div>
  <section class="card">
    <div class="muted small">등록하면 그날과 전날은 점호 없음</div>
    <div style="display:flex;gap:8px;margin-top:10px"><input type="date" id="holi" style="flex:1">
      <button class="btn" style="flex:none;width:64px" onclick="addHoliday()">추가</button></div>
    <div class="list">${S.holidays.length?S.holidays.map(h=>`<div class="item"><span>${h}</span>
      <button class="btn" style="flex:none;width:54px;padding:6px" onclick="delHoliday('${h}')">삭제</button></div>`).join(''):'<div class="muted small">등록된 공휴일 없음</div>'}</div>
  </section>

  <details><summary>규정 요약 보기</summary>
    <p>· 인원점검 23:30 (폐문 23:30), 호명 점호 23:25~23:40<br>
    · 외박신청은 당일 22:00까지, 월 10회<br>
    · 무단외박 -2점, 초과 1회당 -1점<br>
    · 점호 불참 누적 5회 → 한 학기 입사 불가, 6회 → 강제 퇴사<br>
    · 공휴일과 전날은 점검 없음</p>
    <p><a class="link" href="https://dorm.wku.ac.kr/?page_id=114" target="_blank">원광대 학생생활관 사생준수 규정 →</a></p>
  </details>
  `;
}

/* ---------- sheet ---------- */
function openCell(k){
  const d=new Date(k+'T00:00:00'),app=isApplied(d),roll=hasRoll(d);
  document.getElementById('sheetBox').innerHTML=`
    <h3>${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일</h3>
    <div class="muted small" style="margin-bottom:10px">점호 확률 ${pct(d)||'0%'}${eligible(d)?'':' · 점호 없는 날'}</div>
    <button class="btn ${app?'primary':''}" onclick="setApp(new Date('${k}T00:00:00'),${!app});closeSheet()">${app?'신청 취소':'외박신청 추가'}</button>
    <button class="btn" onclick="setRoll(new Date('${k}T00:00:00'),${!roll});closeSheet()">${roll?'점호 기록 취소':'점호 있었음(알면)'}</button>
    <button class="btn" onclick="closeSheet()">닫기</button>`;
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){document.getElementById('sheet').classList.remove('on');}
function addHoliday(){const v=document.getElementById('holi').value;if(!v)return;if(!S.holidays.includes(v))S.holidays.push(v);save();render();}
function delHoliday(v){S.holidays=S.holidays.filter(x=>x!==v);save();render();}

render();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
